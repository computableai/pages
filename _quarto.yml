project:
  type: website

website:
  title: "Computable AI"
  description: "A Machine Intelligence Blog"
  site-url: https://computable.ai/pages/
  repo-url: https://github.com/computableai/pages
  favicon: images/favicon.ico
  navbar:
    logo: images/logo-disc.png
    logo-alt: "Computable AI"
    right:
      - about.qmd
      - icon: rss
        href: index.xml
        aria-label: RSS
      - icon: twitter
        href: https://twitter.com/computableai
        aria-label: Twitter
      - icon: github
        href: https://github.com/computableai
        aria-label: GitHub
  page-footer:
    center: "© 2019–2026 the Computable AI authors · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap

# Never execute code in CI; posts are rendered from committed outputs
# (notebook outputs or the _freeze directory). See README.
execute:
  freeze: auto
