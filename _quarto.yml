project:
  type: website

website:
  title: "Computable AI"
  description: "Notes on machine learning, AI engineering, and computation."
  site-url: https://computable.ai/pages/
  repo-url: https://github.com/computableai/pages
  navbar:
    right:
      - about.qmd
      - icon: github
        href: https://github.com/computableai/pages
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS
  page-footer:
    center: "© Computable AI · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap

# Never execute code in CI; posts are rendered from committed outputs
# (notebook outputs or the _freeze directory). See README.
execute:
  freeze: auto
